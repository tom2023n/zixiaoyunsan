<script>
/* 字消云散 —— 受同类汉字消除玩法启发的非官方作品，与任何商业游戏无关；全部图形、音效由代码生成，题库为本项目自行整理 */
(() => {
'use strict';
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
const FONT = '"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","WenQuanYi Micro Hei",sans-serif';
const KFONT = '"Kaiti SC","STKaiti","KaiTi","Noto Serif CJK SC","Songti SC","STSong",' + FONT;
// 字块配色（不按答案着色，只按字本身散列，所以颜色不泄露答案）
const TILE_L = [['#ffe1d2', '#f2b79c'], ['#ffeeb5', '#e9c968'], ['#dff1cf', '#a9d38c'], ['#d3efe9', '#8ccfc2'], ['#d9e8fb', '#9cbfe8'], ['#e4e0fb', '#b2a9ea'], ['#f6dcf2', '#d9a6d1'], ['#ffdbe2', '#eba3b3']];
const TILE_D = [['#5b4038', '#3e2a24'], ['#5a4f2c', '#3d351c'], ['#3a5233', '#263822'], ['#2f4e4b', '#1f3533'], ['#324866', '#213146'], ['#443d63', '#2e2945'], ['#583e57', '#3d2a3c'], ['#5d3843', '#41252e']];
const THEMES = {
  light: { bg:'#f3efe6', bg2:'#ebe4d6', board:'#fdfaf4', board2:'#f6f0e4', boardEdge:'rgba(110,90,60,.13)', spot:'rgba(110,90,60,.06)',
    text:'#2b2d42', sub:'#857d6f', faint:'#b5ab98', card:'#fffdf9', cardEdge:'rgba(43,45,66,.07)', shadow:'rgba(90,70,40,.10)',
    track:'#e8e0cf', seg:'#e7dfcd', segOn:'#fffdf9', red:'#e63946', redSoft:'rgba(230,57,70,.10)', green:'#2a9d8f', greenSoft:'rgba(42,157,143,.12)', gold:'#f4a261', accent:'#e8603f', accent2:'#f6a04d',
    accentShadow:'rgba(232,96,63,.28)', panel:'#fffdf9', blue:'#3a86ff', clockBg:'#e7f0ff', dim:'rgba(43,45,66,.45)', tileInk:'#3a2f2a',
    ink:'#2b2d42', inkText:'#ffffff', toast:'rgba(43,45,66,.92)', toastText:'#fff', deco:0.13, slot:'#efe8da',
    tGood:['#4cc9a4','#2a9d8f'], tMid:['#f9d56e','#f4a261'], tLow:['#ff8a7a','#e63946'], tiles:TILE_L, conf:['#e76f51','#d99a00','#4f9a2c','#17998a','#2f86d0','#4a4fc0','#9447c4','#d64f95'] },
  dark: { bg:'#191b26', bg2:'#11131b', board:'#272a3a', board2:'#222534', boardEdge:'rgba(255,255,255,.07)', spot:'rgba(255,255,255,.04)',
    text:'#eceaf3', sub:'#9c9aae', faint:'#5c5f75', card:'#242737', cardEdge:'rgba(255,255,255,.07)', shadow:'rgba(0,0,0,.35)',
    track:'#33374a', seg:'#2a2d3e', segOn:'#41455e', red:'#ff5a67', redSoft:'rgba(255,90,103,.14)', green:'#3cc2b2', greenSoft:'rgba(60,194,178,.14)', gold:'#ffb36b', accent:'#f06a48', accent2:'#ffa95a',
    accentShadow:'rgba(240,106,72,.30)', panel:'#242737', blue:'#5b9bff', clockBg:'#1f2b45', dim:'rgba(5,6,12,.6)', tileInk:'#f3ede4',
    ink:'#eceaf3', inkText:'#1b1d2a', toast:'rgba(236,234,243,.94)', toastText:'#1b1d2a', deco:0.16, slot:'#1d2030',
    tGood:['#4fd6b2','#2fae9e'], tMid:['#ffd76e','#ffa95a'], tLow:['#ff8a7a','#ff4d5e'], tiles:TILE_D, conf:['#f2876b','#f0b52e','#6fc24c','#2fc2ae','#5aaaf0','#8287f2','#b67de2','#ee77b2'] }
};
const SAVE_KEY = 'zxys_save';
let theme = (() => { try { return JSON.parse(localStorage.getItem(SAVE_KEY) || '{}').theme === 'dark' ? 'dark' : 'light'; } catch (e) { return 'light'; } })();
const C = Object.assign({}, THEMES[theme]);

// ---------- 题库 ----------
const split = s => s.split(/\s+/).filter(Boolean);
const MODES = {
  word:  { name: '词语', L: 2, ordered: true,  tip: '依次点 2 个字，组成常用词语' },
  idiom: { name: '成语', L: 4, ordered: true,  tip: '按顺序点 4 个字，组成成语' },
  pin:   { name: '拼字', L: 2, ordered: false, tip: '点 2 个部件，拼成一个汉字' },
  poem:  { name: '诗句', L: 5, ordered: true,  tip: '按顺序点 5 个字，拼出古诗名句' }
};
const DICT = {};
(function buildDict() {
  const B = window.WORDBANK || { word: '', idiom: '', pin: '', poem: '' };
  for (const m of ['word', 'idiom', 'poem']) {
    const list = [], map = new Map();
    for (const w of split(B[m])) { const ch = [...w]; if (ch.length !== MODES[m].L || map.has(w)) continue; const e = { k: w, chars: ch, text: w }; list.push(e); map.set(w, e); }
    DICT[m] = { list, map };
  }
  const list = [], map = new Map();
  for (const t of split(B.pin)) { const c = [...t]; if (c.length !== 3) continue; const k = [c[0], c[1]].sort().join(''); if (map.has(k)) continue;
    const e = { k, chars: [c[0], c[1]], out: c[2], text: c[0] + ' + ' + c[1] + ' = ' + c[2] }; list.push(e); map.set(k, e); }
  DICT.pin = { list, map };
  for (const m in DICT) { const by = new Map(); for (const e of DICT[m].list) for (const ch of new Set(e.chars)) { if (!by.has(ch)) by.set(ch, []); by.get(ch).push(e); } DICT[m].byChar = by; }
})();
function lookup(mode, chars) {
  const D = DICT[mode]; if (!D) return null;
  const k = MODES[mode].ordered ? chars.join('') : chars.slice().sort().join('');
  return D.map.get(k) || null;
}
// 精确覆盖求解：剩下的字能否全部组成本模式的词条（优先处理候选最少的字，带失败记忆和节点上限）
function solve(mode, counts, limit) {
  const D = DICT[mode], memo = new Set(); let nodes = 0; limit = limit || 40000;
  const keyOf = () => { const a = []; for (const [c, n] of counts) if (n > 0) a.push(c + n); return a.sort().join(','); };
  const fits = e => { const need = new Map(); for (const c of e.chars) need.set(c, (need.get(c) || 0) + 1); for (const [c, n] of need) if ((counts.get(c) || 0) < n) return false; return true; };
  function rec() {
    if (++nodes > limit) throw 0;
    let bestC = null, bestList = null;
    for (const [c, n] of counts) {
      if (n <= 0) continue;
      const cand = (D.byChar.get(c) || []).filter(fits);
      if (!cand.length) return null;
      if (!bestList || cand.length < bestList.length) { bestC = c; bestList = cand; if (cand.length === 1) break; }
    }
    if (!bestList) return [];
    const k = keyOf(); if (memo.has(k)) return null;
    for (const e of bestList) {
      for (const c of e.chars) counts.set(c, counts.get(c) - 1);
      const r = rec();
      for (const c of e.chars) counts.set(c, counts.get(c) + 1);
      if (r) return [e].concat(r);
    }
    memo.add(k); return null;
  }
  try { return rec(); } catch (x) { return null; }
}

// ---------- 存档 ----------
let save = {};
try { save = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}'); } catch (e) {}
let diff = save.diff != null ? save.diff : 0;
let prog = Array.isArray(save.prog) ? save.prog : [1, 1, 1];
let maxLevel = prog[diff] || 1, best = save.best || 0, timeFactor = save.timeFactor || 1;
let hintsStock = save.hints != null ? save.hints : 3;
function persist() {
  prog[diff] = maxLevel;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, diff, prog, best, timeFactor, hints: hintsStock, theme })); } catch (e) {}
}
function applyThemeChrome() {
  document.documentElement.style.background = document.body.style.background = C.bg;
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.setAttribute('content', C.bg);
}
function setTheme(t) { theme = t === 'dark' ? 'dark' : 'light'; Object.assign(C, THEMES[theme]); boardLayer = null; menuLayer = null; bgKey = ''; sprites.clear(); applyThemeChrome(); persist(); dirty = true; }
function setDiff(d) { prog[diff] = maxLevel; diff = d; maxLevel = prog[diff] || 1; persist(); }

// ---------- 工具 ----------
function rngOf(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function vib(ms) { try { if (typeof navigator.vibrate === 'function') navigator.vibrate(ms); } catch (e) {} }

// ---------- 声音（WebAudio 合成） ----------
let actx = null;
function beep(freq, dur, type, vol, slide) {
  if (!actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(vol || 0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const sfx = {
  pick(i) { beep(480 + i * 70, 0.07, 'triangle', 0.09); },
  ok(c) { [0, 1, 2].forEach(k => setTimeout(() => beep(620 + Math.min(c, 8) * 40 + k * 180, 0.12, 'triangle', 0.11), k * 55)); },
  bad() { beep(150, 0.24, 'square', 0.07, 80); },
  warn() { beep(420, 0.12, 'sine', 0.08, 360); },
  win() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.22, 'triangle', 0.12), i * 110)); },
  lose() { [392, 330, 262].forEach((f, i) => setTimeout(() => beep(f, 0.3, 'sine', 0.12), i * 160)); },
  clock() { beep(880, 0.12, 'sine', 0.12); setTimeout(() => beep(1320, 0.15, 'sine', 0.12), 90); },
  click() { beep(660, 0.05, 'sine', 0.06); },
  shuffle() { for (let i = 0; i < 4; i++) setTimeout(() => beep(300 + i * 90, 0.06, 'triangle', 0.06), i * 40); }
};

// ---------- 关卡 ----------
const DIFFS = [
  { name: '普通', t0: 8,  t1: 24, Lmax: 30, tA: 3.4, tB: 8, pen: 3 },
  { name: '困难', t0: 10, t1: 30, Lmax: 20, tA: 2.6, tB: 6, pen: 4 },
  { name: '地狱', t0: 12, t1: 36, Lmax: 14, tA: 2.0, tB: 5, pen: 5 }
];
const MODE_SEQ = ['idiom', 'pin', 'word', 'idiom', 'poem'];
const modeOf = n => n <= 2 ? 'word' : MODE_SEQ[(n - 3) % MODE_SEQ.length];
function genLevel(n, d) {
  const D = DIFFS[d], mode = modeOf(n), M = MODES[mode], pool = DICT[mode].list;
  const t = clamp((n - 1) / (D.Lmax - 1), 0, 1), post = Math.max(0, n - D.Lmax);
  const want = Math.min(36, Math.round(D.t0 + (D.t1 - D.t0) * t + post / 6));
  const K = clamp(Math.round(want / M.L), 2, Math.floor(36 / M.L));
  const rng = rngOf(n * 7919 + 13 + d * 104729);
  const idx = pool.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const x = idx[i]; idx[i] = idx[j]; idx[j] = x; }
  const answers = idx.slice(0, K).map(i => pool[i]);
  const chars = []; answers.forEach(e => e.chars.forEach(c => chars.push(c)));
  for (let i = chars.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const x = chars[i]; chars[i] = chars[j]; chars[j] = x; }
  const N = chars.length, cols = N <= 12 ? 4 : N <= 20 ? 5 : 6, rows = Math.ceil(N / cols);
  const clock = n >= 2 ? Math.floor(rng() * N) : -1;
  const timeMul = Math.max(0.75, 1 - post * 0.005);
  return { n, d, mode, answers, chars, cols, rows, clock, time: (D.tB + N * D.tA) * timeMul, seed: n * 31 + d };
}

// ---------- 游戏状态 ----------
let W = 0, H = 0, DPR = 1, cs = 50, ox = 0, oy = 0, bw = 0, bh = 0;
let state = 'menu', level = 1, mode = 'word', L = 2, cols = 4, rows = 2, tiles = [], plan = [], sel = [], hintIds = [];
let timeLeft = 0, timeTotal = 0, score = 0, levelScore = 0, combo = 0, lastClear = -9, mistakes = 0, groups = 0;
let elapsed = 0, particles = [], floaters = [], toast = null, now = 0, slotFx = null;
let shake = 0, flash = 0, buttons = [], lastResult = null, loseReason = '';
let segAnim = diff, comboAt = -9, panelAt = -9, starPopped = [];

function startLevel(n) {
  level = n;
  const g = genLevel(n, diff);
  mode = g.mode; L = MODES[mode].L; cols = g.cols; rows = g.rows; plan = g.answers.slice();
  tiles = g.chars.map((ch, i) => ({ id: i, ch, ci: hashStr(ch) % 8, alive: true, pop: -1, wrong: 0, clock: i === g.clock, col: 0, row: 0, ry: 0, vy: 0 }));
  layoutTiles(true);
  sel = []; hintIds = []; levelScore = 0; combo = 0; lastClear = -9; mistakes = 0; groups = g.answers.length; elapsed = 0;
  particles = []; floaters = []; shake = 0; flash = 0; slotFx = null;
  timeTotal = Math.round(g.time * timeFactor); timeLeft = timeTotal;
  toast = { text: MODES[mode].tip, life: 2.2 };
  state = 'play'; computeBoard();
}
// 每列从底往上堆；fresh=true 时直接落位（开局），否则保留当前位置做下落动画
function layoutTiles(fresh) {
  const alive = tiles.filter(t => t.alive);
  if (fresh) {
    alive.forEach((t, i) => { t.col = i % cols; t.row = rows - 1 - Math.floor(i / cols); t.ry = t.row; });
    // 最上一行不满时居中
    const top = alive.length % cols;
    if (top) { const off = Math.floor((cols - top) / 2); alive.slice(alive.length - top).forEach((t, i) => { t.col = off + i; }); }
    return;
  }
  for (let c = 0; c < cols; c++) {
    const list = alive.filter(t => t.col === c).sort((a, b) => b.row - a.row);
    list.forEach((t, i) => { t.row = rows - 1 - i; });
  }
}
function shuffleBoard() {
  if (state !== 'play') return;
  const alive = tiles.filter(t => t.alive && t.pop < 0);
  const r = rngOf((Math.random() * 1e9) | 0), order = alive.slice();
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const x = order[i]; order[i] = order[j]; order[j] = x; }
  order.forEach((t, i) => { const c = i % cols, k = Math.floor(i / cols); t.col = c; t.row = rows - 1 - k; t.ry = t.row - 0.6 - Math.random() * 0.4; t.vy = 0; });
  sel = []; hintIds = []; sfx.shuffle(); dirty = true;
}

const aliveCount = () => tiles.reduce((s, t) => s + (t.alive ? 1 : 0), 0);
function tapTile(t) {
  if (!t || !t.alive || t.pop >= 0 || state !== 'play') return;
  const i = sel.indexOf(t.id);
  if (i >= 0) { sel.splice(i, 1); sfx.click(); return; }   // 再点一次取消
  sel.push(t.id); sfx.pick(sel.length);
  if (sel.length >= L) evaluate();
}
function evaluate() {
  const ids = sel.slice(), chars = ids.map(id => tiles[id].ch);
  sel = [];
  const e = lookup(mode, chars);
  if (!e) { wrong(ids, chars); return; }
  const pi = plan.findIndex(p => p.k === e.k);
  if (pi >= 0) { plan.splice(pi, 1); accept(e, ids); return; }
  // 不是预设答案，但也是合法词条：只要剩下的字还能全部组成词，就算对
  const counts = new Map();
  for (const t of tiles) if (t.alive && t.pop < 0 && !ids.includes(t.id)) counts.set(t.ch, (counts.get(t.ch) || 0) + 1);
  const sol = solve(mode, counts);
  if (sol) { plan = sol; accept(e, ids); return; }
  slotFx = { chars, kind: 'warn', life: 0.9 };
  toast = { text: `「${e.out ? e.out : e.text}」没错，但这样消会让剩下的字凑不成词`, life: 2.2 };
  for (const id of ids) tiles[id].wrong = 0.3;
  sfx.warn();
}
function wrong(ids, chars) {
  mistakes++; combo = 0;
  const pen = DIFFS[diff].pen; timeLeft = Math.max(0, timeLeft - pen);
  for (const id of ids) tiles[id].wrong = 0.45;
  slotFx = { chars, kind: 'bad', life: 0.7 };
  shake = 0.25; flash = 0.2; sfx.bad(); vib(50);
  const [x, y] = tileXY(tiles[ids[ids.length - 1]]);
  floaters.push({ x, y: y - cs * 0.4, text: `不成词  -${pen}秒`, life: 1, col: C.red });
}
function accept(e, ids) {
  if (elapsed - lastClear < 4) combo++; else combo = 1;
  if (combo >= 2) comboAt = now;
  lastClear = elapsed;
  const pts = 10 * L + (combo - 1) * 10;
  levelScore += pts; score += pts; groups--;
  let cx = 0, cy = 0;
  for (const id of ids) {
    const t = tiles[id]; t.alive = false; t.pop = 0; const [x, y] = tileXY(t); cx += x; cy += y;
    burst(x, y, C.tiles[t.ci][1], 8);
    if (t.clock) { timeLeft += 5; floaters.push({ x, y, text: '+5秒', life: 1.2, col: C.blue, big: true }); sfx.clock(); }
  }
  cx /= ids.length; cy /= ids.length;
  hintIds = hintIds.filter(id => tiles[id].alive);
  if (hintIds.length && hintIds.length < L) hintIds = [];
  slotFx = { chars: ids.map(id => tiles[id].ch), kind: 'ok', life: 0.8, out: e.out };
  floaters.push({ x: clamp(cx, 90, W - 90), y: cy - cs * 0.3, text: (e.out ? e.text : e.text) , life: 1.1, col: C.green, big: true });
  floaters.push({ x: clamp(cx, 60, W - 60), y: cy + cs * 0.35, text: '+' + pts + (combo >= 2 ? '  连击×' + combo : ''), life: 0.9, col: combo >= 2 ? C.gold : C.green });
  if (combo > 0 && combo % 3 === 0) { timeLeft += 3; floaters.push({ x: W / 2, y: oy - 8, text: '连击奖励 +3秒', life: 1.3, col: C.gold, big: true }); }
  layoutTiles(false);
  sfx.ok(combo);
}
function useHint() {
  if (state !== 'play') return;
  if (hintIds.length && hintIds.every(id => tiles[id].alive)) return;
  if (hintsStock <= 0) { toast = { text: '提示用完了（每过一关 +1）', life: 1.6 }; return; }
  const e = plan[0]; if (!e) return;
  const used = new Set(), ids = [];
  for (const c of e.chars) { const t = tiles.find(t => t.alive && t.pop < 0 && t.ch === c && !used.has(t.id)); if (!t) return; used.add(t.id); ids.push(t.id); }
  hintIds = ids; sel = []; hintsStock--; persist(); sfx.click();
}
function win() {
  state = 'win';
  const stars = mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1;
  const bonus = Math.round(timeLeft) * 5;
  score += bonus; levelScore += bonus;
  best = Math.max(best, score); maxLevel = Math.max(maxLevel, level + 1);
  hintsStock = Math.min(9, hintsStock + 1);
  timeFactor = Math.max(0.85, timeFactor * 0.97);
  lastResult = { stars, bonus, time: elapsed, mistakes };
  persist(); sfx.win();
  panelAt = now; starPopped = []; confetti();
}
function lose(reason) {

  start(n) { score = 0; startLevel(n || 1); },
  planIds() { const e = plan[0]; if (!e) return []; const used = new Set(), ids = [];

  validate(n, d) { const g = genLevel(n, d == null ? diff : d); const M = MODES[g.mode];
