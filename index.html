};
const SAVE_KEY = 'zxys_save';
let theme = (() => { try { return JSON.parse(localStorage.getItem(SAVE_KEY) || '{}').theme === 'dark' ? 'dark' : 'light'; } catch (e) { return 'light'; } })();
const C = Object.assign({}, THEMES[theme]);

// ---------- 题库 ----------
const split = s => s.split(/\s+/).filter(Boolean);
const MODES = {
  word:  { name: '词语', L: 2, ordered: true,  tip: '只能点每列最上面的字，依次组成 2 字词语' },
  idiom: { name: '成语', L: 4, ordered: true,  tip: '从每列最上面取字，按顺序拼出四字成语' },
  pin:   { name: '拼字', L: 2, ordered: false, tip: '点 2 个部件，拼成一个汉字' },
  poem:  { name: '诗句', L: 5, ordered: true,  tip: '从每列最上面取字，按顺序拼出五字诗句' }
};
const DICT = {};
(function buildDict() {
  const B = window.WORDBANK || { word: '', idiom: '', pin: '', poem: '' };
  for (const m of ['word', 'idiom', 'poem']) {
    const list = [], map = new Map();
    for (const w of split(B[m])) { const ch = [...w]; if (ch.length !== MODES[m].L || map.has(w)) continue; const e = { k: w, chars: ch, text: w }; list.push(e); map.set(w, e); }
    DICT[m] = { list, map };
  }
  const list = [], map = new Map();
  for (const t of split(B.pin)) { const c = [...t]; if (c.length !== 3) continue; const k = [c[0], c[1]].sort().join(''); if (map.has(k)) continue;
    const e = { k, chars: [c[0], c[1]], out: c[2], text: c[0] + ' + ' + c[1] + ' = ' + c[2] }; list.push(e); map.set(k, e); }
  DICT.pin = { list, map };
  for (const m in DICT) { const by = new Map(); for (const e of DICT[m].list) for (const ch of new Set(e.chars)) { if (!by.has(ch)) by.set(ch, []); by.get(ch).push(e); } DICT[m].byChar = by; }
})();
function lookup(mode, chars) {
  const D = DICT[mode]; if (!D) return null;
  const k = MODES[mode].ordered ? chars.join('') : chars.slice().sort().join('');

}
// 精确覆盖求解：剩下的字能否全部组成本模式的词条（优先处理候选最少的字，带失败记忆和节点上限）
function solve(mode, counts, limit) {
  const D = DICT[mode], memo = new Set(); let nodes = 0; limit = limit || 40000;
  const keyOf = () => { const a = []; for (const [c, n] of counts) if (n > 0) a.push(c + n); return a.sort().join(','); };
  const fits = e => { const need = new Map(); for (const c of e.chars) need.set(c, (need.get(c) || 0) + 1); for (const [c, n] of need) if ((counts.get(c) || 0) < n) return false; return true; };
  function rec() {
    if (++nodes > limit) throw 0;
    let bestC = null, bestList = null;
    for (const [c, n] of counts) {
      if (n <= 0) continue;
      const cand = (D.byChar.get(c) || []).filter(fits);
      if (!cand.length) return null;
      if (!bestList || cand.length < bestList.length) { bestC = c; bestList = cand; if (cand.length === 1) break; }
    }
    if (!bestList) return [];
    const k = keyOf(); if (memo.has(k)) return null;
    for (const e of bestList) {
      for (const c of e.chars) counts.set(c, counts.get(c) - 1);
      const r = rec();
      for (const c of e.chars) counts.set(c, counts.get(c) + 1);
      if (r) return [e].concat(r);
    }
    memo.add(k); return null;
  }

}
// 堆叠求解：colsCh[c] 是第 c 列的字（下标 0 为最底），h[c] 为该列剩余高度；只能从每列顶上按顺序取字。
// 返回一条完整消除序列 [{ e, picks:[列号…] }]，无解返回 null（带失败记忆和节点上限）
function solveStacks(md, colsCh, h0, prefer, limit) {
  const D = DICT[md], h = h0.slice(), counts = new Map(); let total = 0, nodes = 0; limit = limit || 60000;
  for (let c = 0; c < h.length; c++) for (let i = 0; i < h[c]; i++) { const ch = colsCh[c][i]; counts.set(ch, (counts.get(ch) || 0) + 1); total++; }
  if (!total) return [];
  const fits = e => { const need = new Map(); for (const ch of e.chars) need.set(ch, (need.get(ch) || 0) + 1); for (const [ch, n] of need) if ((counts.get(ch) || 0) < n) return false; return true; };
  const seen = new Set(), cand = [];
  const add = e => { if (e && !seen.has(e.k) && fits(e)) { seen.add(e.k); cand.push(e); } };
  (prefer || []).forEach(add);
  for (const ch of counts.keys()) for (const e of (D.byChar.get(ch) || [])) add(e);
  const memo = new Set();
  function extracts(e, k, picks, out) {
    if (k === e.chars.length) { out.push(picks.slice()); return; }
    for (let c = 0; c < h.length; c++) if (h[c] > 0 && colsCh[c][h[c] - 1] === e.chars[k]) { h[c]--; picks.push(c); extracts(e, k + 1, picks, out); picks.pop(); h[c]++; }
  }
  function rec(left) {
    if (left === 0) return [];
    if (++nodes > limit) throw 0;
    const key = h.join(','); if (memo.has(key)) return null;
    for (const e of cand) {
      if (!fits(e)) continue;
      const opts = []; extracts(e, 0, [], opts);
      for (const picks of opts) {
        for (const c of picks) h[c]--; for (const ch of e.chars) counts.set(ch, counts.get(ch) - 1);
        const r = rec(left - e.chars.length);
        for (const c of picks) h[c]++; for (const ch of e.chars) counts.set(ch, counts.get(ch) + 1);

// ---------- 工具 ----------

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// ---------- 声音（WebAudio 合成） ----------
let actx = null;
function beep(freq, dur, type, vol, slide) {
  if (!actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);

    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const sfx = {
  pick(i) { beep(480 + i * 70, 0.07, 'triangle', 0.09); },
  ok(c) { [0, 1, 2].forEach(k => setTimeout(() => beep(620 + Math.min(c, 8) * 40 + k * 180, 0.12, 'triangle', 0.11), k * 55)); },

// ---------- 关卡 ----------
const DIFFS = [
  { name: '普通', t0: 12, t1: 28, Lmax: 30, tA: 4.2, tB: 10, pen: 3, hide: 99, extra: 0 },
  { name: '困难', t0: 14, t1: 32, Lmax: 20, tA: 3.4, tB: 8,  pen: 4, hide: 3,  extra: 1 },
  { name: '地狱', t0: 16, t1: 36, Lmax: 14, tA: 2.8, tB: 6,  pen: 5, hide: 2,  extra: 1 }
];
// 第 1–2 关是 2 字词语热身，之后以成语为主、诗句穿插
const MODE_SEQ = ['idiom', 'idiom', 'poem'];
const modeOf = n => n <= 2 ? 'word' : MODE_SEQ[(n - 3) % MODE_SEQ.length];
// 反向构造堆叠：按「通关顺序」的倒序，把每条词从最后一个字到第一个字依次压到某一列顶上。
// 这样按正序取字时，每个字都正好在某列最上面 → 必然存在一条合法消除序列。
function buildStacks(answers, cols, Hmax, rng) {
  const stacks = Array.from({ length: cols }, () => []);
  for (let k = answers.length - 1; k >= 0; k--) {
    const e = answers[k]; let prev = -1;
    for (let j = e.chars.length - 1; j >= 0; j--) {
      const open = []; for (let c = 0; c < cols; c++) if (stacks[c].length < Hmax) open.push(c);
      let c;
      if (prev >= 0 && stacks[prev].length < Hmax && rng() < 0.22) c = prev;   // 偶尔叠在同一列：取走上面的字才露出下一个
      else {
        const pool = open.filter(x => x !== prev).length ? open.filter(x => x !== prev) : open;
        let tot = 0; const w = pool.map(x => { const v = Math.pow(Hmax - stacks[x].length, 2); tot += v; return v; });
        let r = rng() * tot; c = pool[pool.length - 1];
        for (let i = 0; i < pool.length; i++) { r -= w[i]; if (r <= 0) { c = pool[i]; break; } }
      }
      stacks[c].push(e.chars[j]); prev = c;
    }

}
function genLevel(n, d) {
  const D = DIFFS[d], md = modeOf(n), M = MODES[md], pool = DICT[md].list;
  const t = clamp((n - 1) / (D.Lmax - 1), 0, 1), post = Math.max(0, n - D.Lmax);

  if (md === 'word') want = Math.min(want, 8 + d * 2 + (n - 1) * 2);
  const K = clamp(Math.round(want / M.L), 3, Math.floor(36 / M.L));
  const rng = rngOf(n * 7919 + 13 + d * 104729);

  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const x = idx[i]; idx[i] = idx[j]; idx[j] = x; }

  let clock = null;

// ---------- 游戏状态 ----------
let W = 0, H = 0, DPR = 1, cs = 50, pitch = 35, ox = 0, oy = 0, bw = 0, bh = 0;
let state = 'menu', level = 1, mode = 'word', L = 2, cols = 4, rows = 2, Hmax = 4, tiles = [], stk = [], plan = [], sel = [], hintIds = [], flyers = [];
let timeLeft = 0, timeTotal = 0, score = 0, levelScore = 0, combo = 0, lastClear = -9, mistakes = 0, groups = 0;
let elapsed = 0, particles = [], floaters = [], toast = null, now = 0, slotFx = null;
let shake = 0, flash = 0, buttons = [], lastResult = null, loseReason = '';
let segAnim = diff, comboAt = -9, panelAt = -9, starPopped = [], coverTipAt = -99;

// 把一组「列 → 字」装进 tiles / stk；reuse 时复用已有字块对象（洗牌用）
function placeStacks(stacks, reuse, clock) {
  const pool = reuse ? reuse.slice() : null;
  stk = stacks.map(() => []);
  if (!reuse) tiles = [];
  stacks.forEach((s, c) => s.forEach((ch, i) => {
    let t;
    if (pool) { const k = pool.findIndex(x => x.ch === ch); t = pool.splice(k, 1)[0]; }
    else { t = { id: tiles.length, ch, ci: hashStr(ch) % 8, alive: true, inSlot: false, wrong: 0, nudge: 0, clock: !!(clock && clock[0] === c && clock[1] === i), vy: 0 }; tiles.push(t); }
    t.col = c; t.idx = i; t.row = s.length - 1 - i; t.ry = reuse ? t.row - 1.2 - Math.random() * 0.6 : t.row; t.vy = 0;
    stk[c].push(t.id);

}
const heights = () => stk.map(s => s.length);
const stackChars = () => stk.map(s => s.map(id => tiles[id].ch));
const isTop = t => { const s = stk[t.col]; return !!s && s[s.length - 1] === t.id; };
function replan(prefer) { return solveStacks(mode, stackChars(), heights(), prefer); }

function startLevel(n) {
  level = n;
  const g = genLevel(n, diff);
  mode = g.mode; L = MODES[mode].L; cols = g.cols; Hmax = g.Hmax;
  placeStacks(g.stacks, null, g.clock);
  plan = replan(g.answers) || [];
  sel = []; hintIds = []; flyers = []; levelScore = 0; combo = 0; lastClear = -9; mistakes = 0; groups = g.answers.length; elapsed = 0;
  particles = []; floaters = []; shake = 0; flash = 0; slotFx = null;
  timeTotal = Math.round(g.time * timeFactor); timeLeft = timeTotal;

}
// 洗牌：用剩下的词条重新反向构造一次堆叠（依然保证有解）
function shuffleBoard() {
  if (state !== 'play') return;
  undoAll(true);
  const ans = (plan.length ? plan.map(p => p.e) : []).slice();
  if (!ans.length) return;

// ---------- 输入 ----------
function tileAt(px, py) {
  // 同一列里行号最小（最上面）的那块盖在别人上面，优先命中
  let best = null;
  for (const t of tiles) {
    if (!t.alive || t.inSlot) continue;
    const [x, y] = tileXY(t);
    if (Math.abs(px - x) <= cs / 2 && py >= y - cs / 2 && py <= y + cs / 2) { if (!best || t.row < best.row) best = t; }
  }
  return best;
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); dirty = true;
  unlockAudio();
  const rc0 = cv.getBoundingClientRect(); const x = e.clientX - rc0.left, y = e.clientY - rc0.top;
  for (const b of buttons) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { if (btnBusy) return; sfx.click(); pressK = b.key; pressAt = now; btnBusy = true;
    setTimeout(() => { btnBusy = false; try { b.cb(); } finally { dirty = true; } }, 90); return; }
  if (state === 'play') tapTile(tileAt(x, y));
});
cv.addEventListener('pointermove', e => {
  if ((e.pointerType || 'mouse') !== 'mouse') return;
  const mx = e.clientX - cvRect.left, my = e.clientY - cvRect.top;
  let over = false; for (const b of buttons) if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) over = true;
  if (!over && state === 'play' && tileAt(mx, my)) over = true;

});
addEventListener('keydown', e => {
  if (state !== 'play') return;
  if (e.key === 'h' || e.key === 'H') useHint();
  else if (e.key === 'r' || e.key === 'R') startLevel(level);
  else if (e.key === 's' || e.key === 'S') shuffleBoard();
  else if (e.key === 'z' || e.key === 'Z' || e.key === 'Backspace') undo();
  else if (e.key === 'Escape') undoAll();
  dirty = true;
});
addEventListener('resize', queueResize);
addEventListener('orientationchange', queueResize);
if (window.visualViewport) visualViewport.addEventListener('resize', queueResize);
['gesturestart', 'gesturechange', 'dblclick'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));

['contextmenu', 'selectstart'].forEach(t => document.addEventListener(t, e => e.preventDefault()));

  });
}

// ---------- 主循环（空闲降帧） ----------
let last = performance.now(), lastRender = 0, rafId = 0, running = false, lastFrameAt = 0;
function animating() {

  if (pressK && now - pressAt < 0.22) return true;
  if (segAnim !== diff) return true;
  if (state !== 'play' && state !== 'menu' && now - panelAt < 1.3) return true;
  if (state !== 'play') return false;
  if (combo >= 2 && now - comboAt < 0.5) return true;

}

addEventListener('pageshow', () => { resize(false); stopLoop(); startLoop(); });
addEventListener('focus', () => { if (!document.hidden) startLoop(); });
