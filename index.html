<script>
/* 字消云散 v3 —— 受「半词牌叠层消除」类玩法启发的非官方作品，与任何商业游戏无关；全部图形、音效由代码生成，题库为本项目自行整理 */
(() => {
'use strict';
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
const FONT = '"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","WenQuanYi Micro Hei",sans-serif';
const KFONT = '"Kaiti SC","STKaiti","KaiTi","楷体","BiauKai","Kai","Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong",serif';
// 中国风配色：日间＝宣纸水墨；夜间＝墨蓝 + 朱砂 + 金
const THEMES = {
  light: { bg:'#efe6d2', bg2:'#e2d5b9', ink:'#1e1b17', ink2:'#4a433a', sub:'#7b6f5d', faint:'#a99c84', red:'#b3322a', red2:'#cf4a3b', gold:'#a87f2c', gold2:'#d6b25a',
    mount:'30,38,40', mist:'239,230,210', sky:null, moon:'#c9473a', moonA:0.18,
    face:'#fbf7ec', face2:'#efe7d4', side:'#b7a782', edge:'rgba(70,55,30,.35)', tInk:'#17140f',
    cFace:'#bdb7ab', cFace2:'#aea89b', cSide:'#8a8476', cInk:'#5e5950', hint:'#d6a02a',
    tray:'#e6d0a0', tray2:'#d5b97f', trayEdge:'#8e6a2f', cell:'rgba(120,85,30,.16)',
    hold:'rgba(36,32,28,.86)', holdEdge:'rgba(214,178,90,.55)', holdText:'#e9d8a8',
    panel:'#f6eedc', panel2:'#eadfc4', rod:'#5a3a22', rodCap:'#c9a24a', dim:'rgba(24,20,14,.52)',
    bang:'#f1d98a', bang2:'#e2c062', bangInk:'#3b2a10', track:'rgba(90,70,40,.18)',
    btn:'#2a2622', btnInk:'#f4ead2', toast:'rgba(30,27,23,.9)', toastText:'#f4ead2', fret:'rgba(120,85,40,.55)', cloud:'rgba(168,127,44,.30)' },
  dark: { bg:'#16202f', bg2:'#0b111b', ink:'#efe2c2', ink2:'#cdbf9c', sub:'#8f97a8', faint:'#5b6478', red:'#c9443a', red2:'#e0584a', gold:'#d4ae5c', gold2:'#ecd08a',
    mount:'5,9,16', mist:'22,32,47', sky:'#1d2a3e', moon:'#efe0b0', moonA:0.9,
    face:'#ece3cc', face2:'#ddd1b3', side:'#9c8c68', edge:'rgba(0,0,0,.4)', tInk:'#121a26',
    cFace:'#4a5367', cFace2:'#414a5d', cSide:'#2b3243', cInk:'#8d96aa', hint:'#ecc25a',
    tray:'#26324a', tray2:'#1c2639', trayEdge:'#c39a4a', cell:'rgba(212,174,92,.16)',
    hold:'rgba(4,7,12,.78)', holdEdge:'rgba(212,174,92,.45)', holdText:'#e8cf8e',
    panel:'#1f2a3d', panel2:'#18212f', rod:'#3d2a1a', rodCap:'#d4ae5c', dim:'rgba(2,4,8,.62)',
    bang:'#3a2d16', bang2:'#2c2210', bangInk:'#efd590', track:'rgba(239,226,194,.14)',
    btn:'#0c121c', btnInk:'#ecd08a', toast:'rgba(239,226,194,.94)', toastText:'#16202f', fret:'rgba(212,174,92,.5)', cloud:'rgba(212,174,92,.22)' }
};
const SAVE_KEY = 'zxys_save';
let save = {};
try { save = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}') || {}; } catch (e) { save = {}; }
let theme = save.theme === 'dark' ? 'dark' : 'light';
let maxLevel = Math.max(1, save.v === 3 && save.lv3 ? save.lv3 | 0 : 1);
let soundOn = save.sound !== false, totalStars = save.stars3 | 0;
const C = Object.assign({}, THEMES[theme]);
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 3, lv3: maxLevel, theme, sound: soundOn, stars3: totalStars })); } catch (e) {} }

// ---------- 题库：每条四字成语拆成「前半」「后半」两块牌 ----------
const IDIOMS = [], DICTSET = new Set();
(function () {
  const B = window.WORDBANK || { idiom: '' };
  for (const w of String(B.idiom).split(/\s+/)) { const ch = [...w]; if (ch.length !== 4 || DICTSET.has(w)) continue; DICTSET.add(w); IDIOMS.push({ w, f: ch[0] + ch[1], b: ch[2] + ch[3] }); }
})();

// ---------- 工具 ----------
function rngOf(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function vib(ms) { try { if (typeof navigator.vibrate === 'function') navigator.vibrate(ms); } catch (e) {} }
function shuffleArr(a, r) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

// ---------- 声音（WebAudio 合成，五声音阶） ----------
let actx = null;
function beep(freq, dur, type, vol, slide, delay) {
  if (!actx || !soundOn) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + (delay || 0);
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
const PENTA = [392, 440, 523, 587, 659, 784, 880, 1046];
const sfx = {
  pick(i) { beep(PENTA[clamp(i, 0, 3)], 0.12, 'triangle', 0.09); },
  clear(c) { const b = clamp(c, 0, 3); [0, 2, 4].forEach((k, i) => beep(PENTA[b + k] || 1046, 0.42, 'triangle', 0.1, 0, i * 0.07)); },
  bad() { beep(180, 0.22, 'sine', 0.1, 110); },
  win() { [523, 587, 659, 784, 880, 1046].forEach((f, i) => beep(f, 0.5, 'triangle', 0.1, 0, i * 0.1)); },
  lose() { [440, 392, 330, 262].forEach((f, i) => beep(f, 0.45, 'sine', 0.11, 0, i * 0.16)); },
  click() { beep(784, 0.06, 'sine', 0.05); },
  item() { [659, 784, 1046].forEach((f, i) => beep(f, 0.18, 'triangle', 0.08, 0, i * 0.05)); },
  shuffle() { for (let i = 0; i < 5; i++) beep(PENTA[i], 0.08, 'triangle', 0.06, 0, i * 0.04); }
};

// ---------- 关卡生成 ----------
// 坐标单位：半格。横牌 4×2，竖牌 2×4；棋盘 14×16 半格（7×8 格）。层号越大越靠上。
const SLOT = 4, HOLD = 4, BW = 14, BH = 16;
const RANKS = ['童生', '秀才', '举人', '贡士', '进士', '探花', '榜眼', '状元'], RANK_AT = [0, 3, 8, 15, 25, 38, 55, 80];
function rankOf(cleared) { let r = 0; for (let i = 0; i < RANKS.length; i++) if (cleared >= RANK_AT[i]) r = i; return r; }
const ITEM_KEYS = ['shuffle', 'out', 'hint', 'joker'], ITEM_NAME = { shuffle: '洗牌', out: '移出', hint: '提示', joker: '万能' };
const ITEM_STOCK = { shuffle: 1, out: 1, hint: 2, joker: 1 };
function params(n) {
  const t = Math.min(1, (n - 1) / 32), boss = n >= 5 && n % 5 === 0;
  return {
    board: n <= 2 ? 10 : Math.round(16 + t * 56 + (boss ? 6 : 0)),
    layers: Math.min(7, 2 + Math.floor(t * 5) + (boss ? 1 : 0)),
    pile: n <= 2 ? 0 : Math.min(8, 1 + Math.floor((n - 1) / 5)),
    open: n <= 3 ? 1 : n <= 10 ? 2 : (boss || n % 3 === 0) ? 3 : 2,   // 设计解里字槽最多同时等配的块数（≤3，保证 4 格不爆）
    vprob: n <= 1 ? 0.2 : 0.4, boss
  };
}
const ov = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;   // 严格重叠（面积 > 0）
function computeCovers(T) {
  for (const t of T) t.cov = [];
  for (const a of T) {
    if (a.pile != null) { for (const o of T) if (o.pile === a.pile && o.pidx > a.pidx) a.cov.push(o.id); continue; }   // 侧堆：上面所有牌都压着它
    for (const b of T) if (b.pile == null && b.layer > a.layer && ov(a, b)) a.cov.push(b.id);
  }
}
// 选一组互不「串词」的成语：任意两块来自不同成语的半词，前后拼起来都不能是题库里的成语，也不允许同字面的半词
function pickIdioms(K, rng) {
  const pool = shuffleArr(IDIOMS.slice(), rng), out = [], halves = new Set();
  for (const e of pool) {
    if (out.length >= K) break;
    if (e.f === e.b || halves.has(e.f) || halves.has(e.b)) continue;
    let bad = false;
    for (const h of halves) { if (DICTSET.has(h + e.f) || DICTSET.has(e.f + h) || DICTSET.has(h + e.b) || DICTSET.has(e.b + h)) { bad = true; break; } }
    if (bad) continue;
    out.push(e); halves.add(e.f); halves.add(e.b);
  }
  return out.length >= K ? out : null;
}
function genLevel(n) {
  const P = params(n);
  for (let attempt = 0; attempt < 30; attempt++) {
    const rng = rngOf(n * 7919 + attempt * 104729 + 17), T = [];
    const ws = []; for (let l = 0; l < P.layers; l++) ws.push(1 - l * 0.1);
    const sw = ws.reduce((a, b) => a + b, 0);
    let byLayer = [];
    for (let l = 0; l < P.layers; l++) {
      const cnt = Math.max(1, Math.round(P.board * ws[l] / sw)), mine = [], prev = byLayer[l - 1] || [];
      for (let tries = 0; mine.length < cnt && tries < 5000; tries++) {
        const v = rng() < P.vprob, w = v ? 2 : 4, h = v ? 4 : 2;
        const sp = l === 0 || rng() < 0.4, cx = sp ? rng() : (rng() + rng()) / 2, cy = sp ? rng() : (rng() + rng()) / 2;   // 底层铺满，上层略向中间聚
        let x = Math.round(cx * (BW - w)), y = Math.round(cy * (BH - h));
        if (l % 2 === 0) { x -= x & 1; y -= y & 1; }
        const r = { x, y, w, h };
        if (mine.some(o => ov(o, r))) continue;
        if (l > 0 && !prev.some(o => ov(o, r))) continue;
        mine.push(r);
      }
      for (const r of mine) T.push({ id: T.length, x: r.x, y: r.y, w: r.w, h: r.h, v: r.h > r.w, layer: l, pile: null, pidx: 0 });
      byLayer.push(mine);
    }
    while ((T.length + P.pile * 2) % 2) T.pop();
    for (let p = 0; p < 2; p++) for (let i = 0; i < P.pile; i++) T.push({ id: T.length, x: 0, y: 0, w: 4, h: 2, v: false, layer: 99, pile: p, pidx: i });
    const N = T.length; if (N < 4) continue;
    computeCovers(T);
    // 反向构造：先按「遮挡关系」随机拿出一条完整的取牌顺序，再沿这条顺序配对填词（同时最多 open 个半词在等配），保证不用道具也有解
    const alive = new Array(N).fill(true), seq = [];
    while (seq.length < N) {
      const ex = []; for (let i = 0; i < N; i++) if (alive[i] && T[i].cov.every(j => !alive[j])) ex.push(i);
      const i = ex[Math.floor(rng() * ex.length)]; alive[i] = false; seq.push(i);
    }
    const ids = pickIdioms(N / 2, rng); if (!ids) continue;
    let open = [], k = 0;
    for (let s = 0; s < N; s++) {
      const rest = N - s, t = T[seq[s]];
      const canOpen = open.length < P.open && rest - 1 >= open.length + 1;
      const doOpen = open.length === 0 || (canOpen && rng() < 0.5);
      if (doOpen) { const part = rng() < 0.5 ? 0 : 1; t.k = k; t.part = part; open.push({ k, part }); k++; }
      else { const oi = Math.floor(rng() * open.length), o = open.splice(oi, 1)[0]; t.k = o.k; t.part = 1 - o.part; }
    }
    if (open.length) continue;
    for (const t of T) { const e = ids[t.k]; t.idiom = e.w; t.text = t.part === 0 ? e.f : e.b; }
    for (const t of T) t.mate = T.find(o => o !== t && o.k === t.k).id;
    return { n, P, tiles: T, seq, idioms: ids.map(e => e.w) };
  }
  return null;
}

// ---------- 求解器 ----------
// st[i]: 'b' 在牌堆/侧堆上；'h' 在暂存区；'s' 在字槽；'g' 已消除。
// 两条支配规则（不会漏解）：① 字槽里有某块的另一半且它可取 → 直接取；② 一对两半同时可取且字槽 ≤2 → 直接成对取。其余情况才分支。
function solveState(T, st0, limit) {
  const N = T.length, st = st0.slice(); let nodes = 0; limit = limit || 50000;
  const memo = new Set(), path = [];
  const free = i => st[i] === 'h' || (st[i] === 'b' && T[i].cov.every(j => st[j] !== 'b'));
  const blockers = i => { if (st[i] === 'h' || st[i] === 's') return 0; let c = 0; for (const j of T[i].cov) if (st[j] === 'b') c++; return c; };
  function rec() {
    if (++nodes > limit) throw 0;
    let left = 0, sc = 0; for (let i = 0; i < N; i++) { if (st[i] !== 'g') left++; if (st[i] === 's') sc++; }
    if (!left) return true;
    const key = st.join(''); if (memo.has(key)) return false;
    const av = []; for (let i = 0; i < N; i++) if (free(i)) av.push(i);
    for (const i of av) { const m = T[i].mate; if (st[m] === 's') {
      const a = st[i]; st[i] = 'g'; st[m] = 'g'; path.push(i);
      if (rec()) return true; path.pop(); st[i] = a; st[m] = 's'; memo.add(key); return false; } }
    if (sc >= 3) { memo.add(key); return false; }
    if (sc <= 2) for (const i of av) { const m = T[i].mate; if (m > i && free(m)) {
      const a = st[i], b = st[m]; st[i] = 'g'; st[m] = 'g'; path.push(i, m);
      if (rec()) return true; path.pop(); path.pop(); st[i] = a; st[m] = b; memo.add(key); return false; } }
    const order = av.map(i => [i, blockers(T[i].mate)]).sort((p, q) => p[1] - q[1]);
    for (const [i] of order) {
      const a = st[i]; st[i] = 's'; path.push(i);
      if (rec()) return true; path.pop(); st[i] = a;
    }
    memo.add(key); return false;
  }
  try { return rec() ? { path, nodes } : { path: null, nodes }; } catch (x) { return { path: null, nodes, limit: true }; }
}

// ---------- 游戏状态 ----------
let W = 0, H = 0, DPR = 1, U = 40, HU = 20, BX = 0, BY = 0;
let state = 'menu', level = 1, T = [], tray = [], hold = [], items = {}, itemsUsed = 0, cleared = [], boardRev = 0;
let particles = [], floaters = [], toast = null, now = 0, clearFx = [], hintIds = [], hintUntil = 0, shake = 0;
let buttons = [], lastResult = null, panelAt = -9, sealPopped = [], lockUntil = 0, pending = null, loseReason = '', lastIdiom = '';
const G = {};   // 布局
function startLevel(n) {
  const g = genLevel(n); if (!g) { showToast('生成关卡失败'); return; }
  level = n; T = g.tiles; tray = []; hold = []; cleared = []; itemsUsed = 0; lastIdiom = '';
  for (const t of T) { t.st = 'b'; t.disp = null; }
  items = Object.assign({}, ITEM_STOCK);
  clearFx = []; hintIds = []; particles = []; floaters = []; pending = null; lockUntil = 0; lastResult = null; sealPopped = [];
  state = 'play'; boardRev++; dirty = true; toast = null;
  if (n === 1) showToast('点没被压住的白牌，前后两半凑成成语就消除', 3.2);
}
const isFree = t => t && (t.st === 'h' || (t.st === 'b' && t.cov.every(j => T[j].st !== 'b')));
const leftCount = () => T.reduce((s, t) => s + (t.st !== 'g' ? 1 : 0), 0);
function showToast(text, life) { toast = { text, life: life || 1.8 }; dirty = true; }
function tileRect(t) {
  if (t.pile != null) { const p = pileGeom(t.pile), k = Math.max(0, pileCount(t.pile) - 1 - t.pidx);   // 顶牌固定，下面的牌依次向外错开露出边
    return { x: p.x + (t.pile === 0 ? -1 : 1) * Math.min(k, 8) * p.step, y: p.y, w: p.w, h: p.h }; }
  return { x: BX + t.x * HU + 1, y: BY + t.y * HU + 1, w: t.w * HU - 2, h: t.h * HU - 2 };
}
function pileCount(p) { let n = 0; for (const t of T) if (t.pile === p && t.st === 'b') n = Math.max(n, t.pidx + 1); return n; }
function pileGeom(p) { const w = G.pw, h = G.ph, step = 3.5; return { x: p === 0 ? G.pileL : G.pileR, y: G.pileY, w, h, step }; }
function trayCell(i) { return { x: G.trayX + 10 + i * G.cellW + 4, y: G.trayY + (G.trayH - G.tth) / 2, w: G.cellW - 8, h: G.tth }; }
function holdCell(i) { return { x: G.holdX + 8 + i * G.hcellW + 4, y: G.holdY + (G.holdH - G.hth) / 2, w: G.hcellW - 8, h: G.hth }; }

function take(t) {
  if (state !== 'play' || now < lockUntil || !t) return;
  if (!isFree(t)) { sfx.bad(); t.wob = 0.3; showToast('被上面的牌压住了，先消上面的'); return; }
  const from = t.disp ? Object.assign({}, t.disp) : tileRect(t);
  const wasBoard = t.st === 'b';
  if (t.st === 'h') hold.splice(hold.indexOf(t.id), 1);
  t.st = 's'; tray.push(t.id); t.disp = from; hintIds = [];
  if (wasBoard) boardRev++;
  sfx.pick(tray.length - 1); vib(8);
  resolve(t);
}
function resolve(t) {
  const m = T[t.mate];
  if (m.st === 's') {
    const ci = tray.indexOf(m.id), ti = tray.indexOf(t.id);
    clearFx.push({ ids: [m.id, t.id], from: [Object.assign({}, m.disp || trayCell(ci)), Object.assign({}, t.disp)], to: [trayCell(ci), trayCell(ti)], age: 0, idiom: t.idiom, first: m.part === 0 ? m.id : t.id });
    tray = tray.filter(id => id !== m.id && id !== t.id); m.st = 'g'; t.st = 'g';
    cleared.push(t.idiom); lastIdiom = t.idiom;
    sfx.clear(cleared.length % 4);
    if (!T.some(o => o.st !== 'g')) { pending = { kind: 'win', at: now + 0.75 }; lockUntil = now + 99; }
  } else if (tray.length >= SLOT) {
    pending = { kind: 'lose', at: now + 0.45 }; lockUntil = now + 99; loseReason = '4 格都放满了，却凑不出一对'; shake = 0.35; sfx.bad(); vib(40);
  }
  dirty = true;
}
function useItem(key) {
  if (state !== 'play' || now < lockUntil) return false;
  if (!items[key]) { showToast(`本关「${ITEM_NAME[key]}」已用完`); sfx.bad(); return false; }
  let ok = false;
  if (key === 'shuffle') ok = doShuffle();
